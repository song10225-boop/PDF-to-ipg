<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>비숑 PDF 도구 | 간편한 문서 작업</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
<style>
:root{--accent:#e85d75;--accent-dark:#d94762;--soft:#fff0f3}
body{font-family:"Noto Sans KR",sans-serif;background:#fffafb;color:#292b33;font-size:17px;line-height:1.65}
.text-xs{font-size:.875rem!important;line-height:1.55!important}
.text-sm{font-size:1rem!important;line-height:1.65!important}
.tool-card-title{font-size:1.2rem}
.tool-card-desc{font-size:1rem;line-height:1.7;color:#686d7a}
.tool-card-arrow{font-size:.98rem}
.dropzone .block.font-bold{font-size:1.1rem}
button,select,input,textarea{font-family:inherit}
@media(max-width:640px){body{font-size:16px}.tool-card{min-height:175px;padding:1.2rem}.tool-card-title{font-size:1.12rem}.tool-card-desc{font-size:.96rem}}
.tool-card{display:flex;flex-direction:column;align-items:flex-start;gap:.8rem;padding:1.35rem;text-align:left;border:1px solid #f4e3e7;border-radius:22px;background:#fff;min-height:190px;box-shadow:0 5px 18px #44202a06;transition:transform .18s,box-shadow .18s,border-color .18s;width:100%}
.tool-card:hover{transform:translateY(-3px);border-color:#f0b7c2;box-shadow:0 12px 26px #e85d7518}
.tool-card-icon{width:54px;height:54px;border-radius:17px;display:flex;align-items:center;justify-content:center;font-size:1.45rem;background:#fff0f3;color:#d94762}
.tool-card-title{font-weight:800;font-size:1.05rem;color:#292b33}
.tool-card-desc{font-size:.86rem;line-height:1.55;color:#777b88}
.tool-card-arrow{margin-top:auto;color:#d94762;font-size:.85rem;font-weight:750}
#tool-view{display:none}#tool-view.show{display:block}
.dropzone{position:relative;border:2px dashed #f0b7c2;background:#fff;border-radius:22px;padding:2.6rem 1rem;text-align:center;transition:.2s}
.dropzone:hover{border-color:var(--accent);background:#fffafb}
.dropzone input[type=file]{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}
.primary{background:var(--accent);color:white;border-radius:12px;padding:.72rem 1.1rem;font-weight:700;transition:.2s}
.primary:hover{background:var(--accent-dark)}
.secondary{background:#f4f4f6;color:#454752;border-radius:12px;padding:.72rem 1rem;font-weight:650}
.secondary:hover{background:#e9e9ed}
.back-home-button{background:#fff0f3!important;color:#d94762!important;border:1px solid #f4c5cf;font-weight:800}
.back-home-button:hover{background:#ffe2e9!important;color:#c73552!important}
.tool-panel{display:none}
.tool-panel.active{display:block}
.preview-card{background:#fff;border:1px solid #eee4e7;border-radius:16px;padding:12px;box-shadow:0 4px 15px #44202a08}
.file-tile{cursor:grab;user-select:none}
.status{display:none;margin-top:1rem;padding:.8rem 1rem;border-radius:12px;background:#fff0f3;color:#9f3047;font-size:.9rem}
.status.show{display:block}
@media(max-width:767px){.dropzone{padding:2rem 1rem}}
footer{margin-top:1rem}
.back-home-button{display:inline-flex;align-items:center;gap:.35rem}
.back-home-button .bichon-mini{width:23px;height:23px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;border-radius:50%;background:#ffe7ed;border:1.5px solid #d94762;padding:1px}
.back-home-button .bichon-mini svg{width:100%;height:100%;display:block}
.creator-signature{color:#b66b7d!important;font-weight:700;letter-spacing:.02em}
.creator-bichon{width:32px;height:32px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:#fff0f3;border:2px solid #d94762;box-shadow:0 0 0 2px #fff,0 0 0 3px #f2c4ce;padding:1px;flex-shrink:0}
.creator-bichon svg{width:100%;height:100%;display:block}
.filename-box{margin:0 0 1.25rem;padding:1rem 1.1rem 1.05rem;border:1px solid #efc5cf;border-radius:14px;background:#fff9fa;box-shadow:0 2px 7px #44202a08}
.filename-heading{display:flex;align-items:center;gap:.55rem;font-size:1.04rem;font-weight:800;color:#8f4053;margin-bottom:.3rem}
.filename-heading .filename-icon{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:9px;background:#f7dce3;color:#a94d64;font-size:.9rem;flex-shrink:0}
.filename-description{font-size:.94rem!important;font-weight:500;color:#66525a;line-height:1.6;margin:.2rem 0 .7rem}
.filename-input{display:block!important;width:100%!important;max-width:none!important;min-height:48px;border:1.5px solid #dca6b4!important;border-radius:9px!important;background:#fff!important;padding:.7rem .9rem!important;font-size:1rem!important;font-weight:600!important;color:#292b33!important;box-shadow:inset 0 1px 2px #00000005;outline:none}
.filename-input:focus{border-color:#c7798e!important;box-shadow:0 0 0 3px #e9bdc933!important}
.filename-input-hint{font-size:.86rem!important;color:#79616a;margin-top:.45rem;font-weight:500}
@media(max-width:640px){.filename-box{padding:.9rem}.filename-heading{font-size:1rem}.filename-description{font-size:.9rem!important}.filename-input{min-height:46px;font-size:.96rem!important}}
</style>
</head>
<body class="min-h-screen">
<header class="bg-white border-b border-pink-100">
  <div class="max-w-6xl mx-auto px-4 py-5 flex items-center gap-4">
    <div class="w-14 h-14 rounded-2xl bg-pink-50 flex items-center justify-center shrink-0">
      <svg viewBox="0 0 100 100" class="w-12 h-12" role="img" aria-label="복슬복슬한 비숑 프리제">
        <g fill="#fff" stroke="#e8dfe2" stroke-width="1.7">
          <circle cx="50" cy="19" r="12"/><circle cx="34" cy="22" r="12"/><circle cx="66" cy="22" r="12"/>
          <circle cx="23" cy="34" r="12"/><circle cx="77" cy="34" r="12"/><circle cx="18" cy="49" r="11"/><circle cx="82" cy="49" r="11"/>
          <circle cx="23" cy="64" r="12"/><circle cx="77" cy="64" r="12"/><circle cx="35" cy="77" r="12"/><circle cx="65" cy="77" r="12"/><circle cx="50" cy="81" r="12"/>
          <circle cx="35" cy="37" r="13"/><circle cx="65" cy="37" r="13"/><circle cx="50" cy="32" r="14"/><circle cx="33" cy="52" r="14"/><circle cx="67" cy="52" r="14"/><circle cx="50" cy="56" r="22"/>
        </g>
        <ellipse cx="37" cy="48" rx="3.6" ry="4.5" fill="#34313a"/><ellipse cx="63" cy="48" rx="3.6" ry="4.5" fill="#34313a"/>
        <ellipse cx="27" cy="58" rx="5" ry="3.5" fill="#ffbdcb"/><ellipse cx="73" cy="58" rx="5" ry="3.5" fill="#ffbdcb"/>
        <path d="M45 57q5-6 10 0q-1 6-5 6t-5-6z" fill="#34313a"/><path d="M50 63v4m0 0q-5 4-9-1m9 1q5 4 9-1" fill="none" stroke="#34313a" stroke-width="2.2" stroke-linecap="round"/>
        <path d="M62 17l7-8 2 9 8 3-8 4-2 8-5-7-8-1 6-4z" fill="#ff9db3" stroke="#e85d75" stroke-width="1.2"/>
      </svg>
    </div>
    <div>
      <h1 class="text-xl sm:text-2xl font-extrabold tracking-tight">비숑 PDF 도구</h1>
      <p class="text-sm text-slate-500 mt-1">복잡한 PDF 작업을 간단하게, 브라우저에서 바로</p>
    </div>
  </div>
</header>

<main class="max-w-6xl mx-auto px-4 py-9 sm:py-12">
  <section id="home-panel">
    <div class="text-center max-w-2xl mx-auto mb-9 sm:mb-11">
      <div class="inline-flex items-center gap-2 rounded-full bg-white border border-pink-100 px-4 py-2 text-sm font-bold text-pink-600 shadow-sm mb-5"><span>🐾</span> 작고 귀여운 PDF 도우미</div>
      <h2 class="text-3xl sm:text-4xl font-extrabold leading-tight tracking-tight">PDF 작업, <span class="text-pink-500">비숑이 도와줄게요!</span></h2>
      <p class="text-slate-500 mt-3 text-sm sm:text-base">필요한 기능을 골라보세요. 파일은 내 기기에서 처리돼요.</p>
    </div>
    <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5">
      <button type="button" class="tool-card" data-mode="pdf-to-img"><span class="tool-card-icon"><i class="fa-regular fa-images"></i></span><span class="tool-card-title">PDF를 이미지로</span><span class="tool-card-desc">PDF 페이지를 JPG 또는 PNG 이미지로 바꾸고 한 번에 내려받아요.</span><span class="tool-card-arrow">기능 열기 <i class="fa-solid fa-arrow-right ml-1"></i></span></button>
      <button type="button" class="tool-card" data-mode="img-to-pdf"><span class="tool-card-icon" style="background:#eef8ff;color:#3887c9"><i class="fa-regular fa-file-pdf"></i></span><span class="tool-card-title">이미지를 PDF로</span><span class="tool-card-desc">여러 이미지를 원하는 순서로 정리해 하나의 PDF로 만들어요.</span><span class="tool-card-arrow">기능 열기 <i class="fa-solid fa-arrow-right ml-1"></i></span></button>
      <button type="button" class="tool-card" data-mode="pdf-merge"><span class="tool-card-icon" style="background:#f1edff;color:#7960c8"><i class="fa-solid fa-layer-group"></i></span><span class="tool-card-title">PDF 합치기</span><span class="tool-card-desc">여러 PDF 파일을 원하는 순서대로 하나로 합쳐요.</span><span class="tool-card-arrow">기능 열기 <i class="fa-solid fa-arrow-right ml-1"></i></span></button>
      <button type="button" class="tool-card" data-mode="pdf-edit"><span class="tool-card-icon" style="background:#fff5e8;color:#c98429"><i class="fa-solid fa-scissors"></i></span><span class="tool-card-title">페이지 편집</span><span class="tool-card-desc">페이지를 미리 보고 필요 없는 페이지를 지우거나 순서를 바꿔요.</span><span class="tool-card-arrow">기능 열기 <i class="fa-solid fa-arrow-right ml-1"></i></span></button>
      <button type="button" class="tool-card" data-mode="pdf-content-edit"><span class="tool-card-icon" style="background:#f5f0ff;color:#8063bd"><i class="fa-solid fa-pen-nib"></i></span><span class="tool-card-title">PDF 내용 편집</span><span class="tool-card-desc">기존 글자 가리기·새 글자 입력, 형광펜, 밑줄, 서명을 추가해요.</span><span class="tool-card-arrow">기능 열기 <i class="fa-solid fa-arrow-right ml-1"></i></span></button>
      <button type="button" class="tool-card" data-mode="pdf-split"><span class="tool-card-icon" style="background:#eaf8f0;color:#329667"><i class="fa-solid fa-file-circle-minus"></i></span><span class="tool-card-title">PDF 나누기</span><span class="tool-card-desc">페이지 범위를 지정해 여러 개의 PDF로 나누고 ZIP으로 받아요.</span><span class="tool-card-arrow">기능 열기 <i class="fa-solid fa-arrow-right ml-1"></i></span></button>
      <button type="button" class="tool-card" data-mode="pdf-page-number"><span class="tool-card-icon" style="background:#fff4e8;color:#c98429"><i class="fa-solid fa-list-ol"></i></span><span class="tool-card-title">PDF 페이지 번호</span><span class="tool-card-desc">페이지 하단에 번호를 넣고 위치, 크기, 글꼴을 선택해요.</span><span class="tool-card-arrow">기능 열기 <i class="fa-solid fa-arrow-right ml-1"></i></span></button>
      <button type="button" class="tool-card" data-mode="pdf-protect"><span class="tool-card-icon" style="background:#eef4ff;color:#5579c7"><i class="fa-solid fa-lock"></i></span><span class="tool-card-title">PDF 비밀번호 보호</span><span class="tool-card-desc">비밀번호를 설정해 파일을 열 때 암호를 요구하도록 해요.</span><span class="tool-card-arrow">기능 열기 <i class="fa-solid fa-arrow-right ml-1"></i></span></button>
      <div class="rounded-3xl border border-dashed border-pink-200 bg-white/70 p-6 flex flex-col justify-center min-h-[190px]">
        <div class="w-16 h-16 mb-3 rounded-2xl bg-pink-50 flex items-center justify-center">
          <svg viewBox="0 0 100 100" class="w-14 h-14" role="img" aria-label="귀여운 비숑 프리제">
            <g fill="#fff" stroke="#e8dfe2" stroke-width="1.7">
              <circle cx="50" cy="19" r="12"/><circle cx="34" cy="
