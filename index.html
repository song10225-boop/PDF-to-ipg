<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 변환 사이트 (비숑)</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
</head>

<body class="bg-slate-50 min-h-screen text-slate-800 flex flex-col">

    <!-- Header (상단 비숑 아이콘 & 제목) -->
    <header class="bg-white border-b border-slate-200 py-6 px-4 text-center shadow-sm">
        <div class="max-w-7xl mx-auto flex flex-col items-center justify-center gap-3">
            <!-- 볼터치 비숑 캐릭터 (크게 배치) -->
            <div class="w-20 h-20 bg-slate-50 rounded-full p-2 border border-slate-200 shadow-sm flex items-center justify-center">
                <svg viewBox="0 0 100 100" class="w-full h-full">
                    <path d="M 50 12 C 58 12 62 16 67 18 C 73 17 80 20 83 26 C 88 31 90 38 88 44 C 92 50 91 58 87 64 C 88 71 85 78 79 82 C 73 87 65 87 60 85 C 55 89 45 89 40 85 C 35 87 27 87 21 82 C 15 78 12 71 13 64 C 9 58 8 50 12 44 C 10 38 12 31 17 26 C 20 20 27 17 33 18 C 38 16 42 12 50 12 Z" fill="#FFFFFF" stroke="#222222" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="36" cy="48" r="4.5" fill="#222222"/>
                    <circle cx="37.5" cy="46.5" r="1.5" fill="#FFFFFF"/>
                    <circle cx="64" cy="48" r="4.5" fill="#222222"/>
                    <circle cx="65.5" cy="46.5" r="1.5" fill="#FFFFFF"/>
                    <path d="M 47 54 C 47 52 53 52 53 54 C 53 57 47 57 47 54 Z" fill="#222222"/>
                    <path d="M 50 56 L 50 60 M 50 60 C 46 62 43 60 41 58 M 50 60 C 54 62 57 60 59 58" stroke="#222222" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                    <path d="M 47 60 C 47 64 53 64 53 60 Z" fill="#FF8A9A" stroke="#222222" stroke-width="1.5"/>
                    <ellipse cx="28" cy="55" rx="5.5" ry="3.5" fill="#FFB7C5"/>
                    <ellipse cx="72" cy="55" rx="5.5" ry="3.5" fill="#FFB7C5"/>
                </svg>
            </div>
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-slate-800">PDF 변환 사이트 (비숑)</h1>
                <p class="text-xs text-slate-500 mt-1">안전한 브라우저 기반 무제한 PDF 편집 서비스</p>
            </div>
        </div>
    </header>

    <!-- Main Body (왼쪽 메뉴 + 오른쪽 컨텐츠) -->
    <div class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow flex flex-col md:flex-row gap-8">

        <!-- Left Sidebar Menu -->
        <aside class="w-full md:w-64 flex-shrink-0">
            <div class="bg-white p-3 rounded-2xl border border-slate-200 shadow-sm sticky top-6 space-y-1">
                <h2 class="text-xs font-bold text-slate-400 px-3 py-2 uppercase tracking-wider">기능 선택</h2>
                <button id="tab-pdf-to-img" onclick="switchMode('pdf-to-img')" class="w-full px-4 py-3 font-semibold rounded-xl text-left bg-blue-600 text-white shadow-sm transition-all text-sm flex items-center gap-2">
                    <span>1.</span> <i class="fa-solid fa-image"></i> PDF ➔ JPG
                </button>
                <button id="tab-img-to-pdf" onclick="switchMode('img-to-pdf')" class="w-full px-4 py-3 font-semibold rounded-xl text-left text-slate-600 hover:bg-slate-100 transition-all text-sm flex items-center gap-2">
                    <span>2.</span> <i class="fa-solid fa-file-image"></i> JPG ➔ PDF
                </button>
                <button id="tab-pdf-merge" onclick="switchMode('pdf-merge')" class="w-full px-4 py-3 font-semibold rounded-xl text-left text-slate-600 hover:bg-slate-100 transition-all text-sm flex items-center gap-2">
                    <span>3.</span> <i class="fa-solid fa-object-group"></i> PDF 병합
                </button>
                <button id="tab-pdf-edit" onclick="switchMode('pdf-edit')" class="w-full px-4 py-3 font-semibold rounded-xl text-left text-slate-600 hover:bg-slate-100 transition-all text-sm flex items-center gap-2">
                    <span>4.</span> <i class="fa-solid fa-scissors"></i> 페이지 편집
                </button>
                <button id="tab-pdf-split" onclick="switchMode('pdf-split')" class="w-full px-4 py-3 font-semibold rounded-xl text-left text-slate-600 hover:bg-slate-100 transition-all text-sm flex items-center gap-2">
                    <span>5.</span> <i class="fa-solid fa-file-circle-minus"></i> PDF 분할
                </button>
            </div>
        </aside>

        <!-- Right Content Area -->
        <main class="flex-grow w-full">

            <!-- 1. PDF TO IMAGE -->
            <section id="section-pdf-to-img" class="space-y-6">
                <div class="border-2 border-dashed border-slate-300 hover:border-blue-500 rounded-2xl p-10 text-center bg-white shadow-sm transition-all cursor-pointer relative group">
                    <input type="file" id="pdf-file-input" accept="application/pdf" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-10">
                    <div class="w-16 h-16 bg-blue-50 text-blue-600 rounded-full flex items-center justify-center mx-auto text-2xl group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                    </div>
                    <h3 class="text-lg font-bold mt-4 text-slate-700">변환할 PDF 파일을 여기에 올려주세요</h3>
                    <p class="text-xs text-slate-400 mt-1">PDF의 각 페이지를 이미지(JPG/PNG)로 추출합니다</p>
                </div>

                <div id="pdf-controls" class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hidden flex flex-wrap justify-between items-center gap-4">
                    <div>
                        <span id="pdf-file-name" class="font-bold text-slate-800 block text-base"></span>
                        <span id="pdf-page-count" class="text-xs text-slate-500"></span>
                    </div>
                    <div class="flex flex-wrap gap-3 items-center">
                        <select id="export-format" class="border border-slate-300 rounded-lg px-3 py-2 text-sm bg-slate-50 outline-none">
                            <option value="image/jpeg">JPG</option>
                            <option value="image/png">PNG</option>
                        </select>
                        <select id="export-scale" class="border border-slate-300 rounded-lg px-3 py-2 text-sm bg-slate-50 outline-none">
                            <option value="1">기본 화질</option>
                            <option value="1.5">선명</option>
                            <option value="2" selected>고화질 (추천)</option>
                            <option value="3">최고화질</option>
                        </select>
                        <button onclick="downloadAsZip()" class="bg-blue-600 hover:bg-blue-700 text-white rounded-lg px-5 py-2 text-sm font-semibold shadow-sm transition-colors">ZIP 일괄 다운로드</button>
                        <button onclick="resetPdfApp()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg px-4 py-2 text-sm transition-colors">초기화</button>
                    </div>
                </div>

                <div id="pdf-loading" class="hidden text-center py-10">
                    <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-blue-600 border-t-transparent"></div>
                    <p class="mt-3 text-sm font-medium text-slate-600">PDF 파일을 변환 중입니다...</p>
                </div>
                <div id="pdf-preview-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6"></div>
            </section>

            <!-- 2. IMAGE TO PDF -->
            <section id="section-img-to-pdf" class="space-y-6 hidden">
                <div class="border-2 border-dashed border-slate-300 hover:border-indigo-500 rounded-2xl p-10 text-center bg-white shadow-sm transition-all cursor-pointer relative group">
                    <input type="file" id="img-file-input" accept="image/*" multiple class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-10">
                    <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-2xl group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-images"></i>
                    </div>
                    <h3 class="text-lg font-bold mt-4 text-slate-700">PDF로 묶을 이미지들을 선택하세요</h3>
                    <p class="text-xs text-slate-400 mt-1">드래그하여 원하는 이미지 순서대로 배치가 가능합니다</p>
                </div>

                <div id="img-controls" class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hidden flex flex-wrap justify-between items-center gap-4">
                    <span id="img-total-count" class="font-bold text-slate-800">선택된 이미지: 0장</span>
                    <div class="flex flex-wrap gap-3">
                        <select id="pdf-page-size" class="border border-slate-300 rounded-lg px-3 py-2 text-sm bg-slate-50 outline-none">
                            <option value="a4">A4 (표준)</option>
                            <option value="fit">이미지 비율 맞춤</option>
                        </select>
                        <select id="pdf-orientation" class="border border-slate-300 rounded-lg px-3 py-2 text-sm bg-slate-50 outline-none">
                            <option value="portrait">세로형</option>
                            <option value="landscape">가로형</option>
                        </select>
                        <button onclick="generatePDFFromImages()" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg px-5 py-2 text-sm font-semibold shadow-sm transition-colors">PDF 생성하기</button>
                        <button onclick="resetImgApp()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 rounded-lg px-4 py-2 text-sm transition-colors">초기화</button>
                    </div>
                </div>

                <div id="img-sortable-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4"></div>
            </section>

            <!-- 3. PDF MERGE -->
            <section id="section-pdf-merge" class="space-y-6 hidden">
                <div class="border-2 border-dashed border-slate-300 hover:border-purple-500 rounded-2xl p-10 text-center bg-white shadow-sm transition-all cursor-pointer relative group">
                    <input type="file" id="merge-file-input" accept="application/pdf" multiple class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-10">
                    <div class="w-16 h-16 bg-purple-50 text-purple-600 rounded-full flex items-center justify-center mx-auto text-2xl group-hover:scale-110 transition-transform">
                        <i class="fa-solid fa-object-group"></i>
                    </div>
                    <h3 class="text-lg font-bold mt-4 text-slate-700">하나로 합칠 PDF 파일들을 선택하세요</h3>
                    <p class="text-xs text-slate-400 mt-1">목록을 마우스로 끌어서 결합 순서를 정하세요</p>
                </div>

                <div id="merge-controls" class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm hidden flex flex-wrap justify-between items-center gap-4">
                    <span id="merge-total-count" class="font-bold text-slate-800">선택된 PDF: 0개</span>
                    <div class="flex gap-3">
                        <button onclick="executePdfMerge()" class="bg-purple-600 hover:bg-purple-7
