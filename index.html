<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비숑이의 PDF & 이미지 편집 센터</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc =
            'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
</head>

<body class="bg-pink-50/50 min-h-screen text-slate-700 flex flex-col justify-between font-sans">

<header class="bg-white/80 backdrop-blur-md border-b border-pink-100 sticky top-0 z-30 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3.5 flex flex-col lg:flex-row justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <!-- 볼터치 비숑 캐릭터 SVG -->
            <div class="w-12 h-12 bg-pink-100 rounded-2xl p-1.5 shadow-inner flex items-center justify-center border border-pink-200">
                <svg viewBox="0 0 100 100" class="w-full h-full">
                    <!-- 몽실몽실 털 구름 -->
                    <path d="M 50 12 C 58 12 62 16 67 18 C 73 17 80 20 83 26 C 88 31 90 38 88 44 C 92 50 91 58 87 64 C 88 71 85 78 79 82 C 73 87 65 87 60 85 C 55 89 45 89 40 85 C 35 87 27 87 21 82 C 15 78 12 71 13 64 C 9 58 8 50 12 44 C 10 38 12 31 17 26 C 20 20 27 17 33 18 C 38 16 42 12 50 12 Z" fill="#FFFFFF" stroke="#333333" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <!-- 눈 -->
                    <circle cx="36" cy="48" r="4.5" fill="#222222"/>
                    <circle cx="37.5" cy="46.5" r="1.5" fill="#FFFFFF"/>
                    <circle cx="64" cy="48" r="4.5" fill="#222222"/>
                    <circle cx="65.5" cy="46.5" r="1.5" fill="#FFFFFF"/>
                    <!-- 코 & 입 -->
                    <path d="M 47 54 C 47 52 53 52 53 54 C 53 57 47 57 47 54 Z" fill="#222222"/>
                    <path d="M 50 56 L 50 60 M 50 60 C 46 62 43 60 41 58 M 50 60 C 54 62 57 60 59 58" stroke="#222222" stroke-width="2.5" stroke-linecap="round" fill="none"/>
                    <!-- 혀 -->
                    <path d="M 47 60 C 47 64 53 64 53 60 Z" fill="#FF8A9A" stroke="#222222" stroke-width="1.5"/>
                    <!-- 분홍 볼터치 -->
                    <ellipse cx="28" cy="55" rx="5.5" ry="3.5" fill="#FFB7C5" opacity="0.85"/>
                    <ellipse cx="72" cy="55" rx="5.5" ry="3.5" fill="#FFB7C5" opacity="0.85"/>
                </svg>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight text-pink-600 flex items-center gap-1.5">
                    비숑이의 PDF & 이미지 툴 <span class="text-xs font-normal text-pink-400 bg-pink-100 px-2 py-0.5 rounded-full">Soft Pink</span>
                </h1>
                <p class="text-xs text-pink-400">내 웹브라우저에서 안전하게 편집하는 스마트 변환기</p>
            </div>
        </div>

        <!-- 탭 버튼 목록 -->
        <div class="bg-pink-100/70 p-1.5 rounded-2xl flex flex-wrap justify-center gap-1 border border-pink-200/60 text-xs sm:text-sm">
            <button id="tab-pdf-to-img" onclick="switchMode('pdf-to-img')" class="px-3.5 py-2 font-semibold rounded-xl bg-white text-pink-600 shadow-sm transition-all flex items-center gap-1.5">
                <i class="fa-solid fa-image"></i> PDF ➔ JPG
            </button>
            <button id="tab-img-to-pdf" onclick="switchMode('img-to-pdf')" class="px-3.5 py-2 font-semibold rounded-xl text-pink-400 hover:text-pink-600 transition-all flex items-center gap-1.5">
                <i class="fa-solid fa-file-image"></i> JPG ➔ PDF
            </button>
            <button id="tab-pdf-merge" onclick="switchMode('pdf-merge')" class="px-3.5 py-2 font-semibold rounded-xl text-pink-400 hover:text-pink-600 transition-all flex items-center gap-1.5">
                <i class="fa-solid fa-object-group"></i> PDF 병합
            </button>
            <button id="tab-pdf-edit" onclick="switchMode('pdf-edit')" class="px-3.5 py-2 font-semibold rounded-xl text-pink-400 hover:text-pink-600 transition-all flex items-center gap-1.5">
                <i class="fa-solid fa-scissors"></i> 페이지 편집
            </button>
            <button id="tab-pdf-split" onclick="switchMode('pdf-split')" class="px-3.5 py-2 font-semibold rounded-xl text-pink-400 hover:text-pink-600 transition-all flex items-center gap-1.5">
                <i class="fa-solid fa-file-circle-minus"></i> PDF 분할
            </button>
        </div>
    </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-8 w-full flex-grow">

    <!-- 1. PDF TO IMAGE -->
    <section id="section-pdf-to-img" class="space-y-6">
        <div class="border-2 border-dashed border-pink-200 hover:border-pink-400 rounded-3xl p-10 text-center bg-white shadow-sm transition-all cursor-pointer relative group">
            <input type="file" id="pdf-file-input" accept="application/pdf" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
            <div class="w-16 h-16 bg-pink-100 text-pink-500 rounded-full flex items-center justify-center mx-auto text-2xl group-hover:scale-110 transition-transform shadow-inner">
                <i class="fa-solid fa-cloud-arrow-up"></i>
            </div>
            <h3 class="text-lg font-bold mt-4 text-pink-700">변환할 PDF 파일을 여기에 올려주세요</h3>
            <p class="text-xs text-pink-400 mt-1">PDF의 각 페이지를 고화질 JPG/PNG 이미지로 변환합니다</p>
        </div>

        <div id="pdf-controls" class="bg-white p-6 rounded-3xl border border-pink-100 shadow-sm hidden flex flex-wrap justify-between items-center gap-4">
            <div>
                <span id="pdf-file-name" class="font-bold text-pink-800 block text-base"></span>
                <span id="pdf-page-count" class="text-xs text-pink-400"></span>
            </div>
            <div class="flex flex-wrap gap-3 items-center">
                <select id="export-format" class="border border-pink-200 rounded-xl px-3 py-2 text-sm bg-pink-50/50 outline-none focus:ring-2 focus:ring-pink-300">
                    <option value="image/jpeg">JPG</option>
                    <option value="image/png">PNG</option>
                </select>
                <select id="export-scale" class="border border-pink-200 rounded-xl px-3 py-2 text-sm bg-pink-50/50 outline-none focus:ring-2 focus:ring-pink-300">
                    <option value="1">기본 화질</option>
                    <option value="1.5">선명</option>
                    <option value="2" selected>고화질 (추천)</option>
                    <option value="3">최고화질</option>
                </select>
                <button onclick="downloadAsZip()" class="bg-pink-500 hover:bg-pink-600 text-white rounded-xl px-5 py-2 text-sm font-semibold shadow-sm transition-colors">ZIP 일괄 다운로드</button>
                <button onclick="resetPdfApp()" class="bg-pink-100 hover:bg-pink-200 text-pink-600 rounded-xl px-4 py-2 text-sm transition-colors">초기화</button>
            </div>
        </div>

        <div id="pdf-loading" class="hidden text-center py-10">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-pink-400 border-t-transparent"></div>
            <p class="mt-3 text-sm font-medium text-pink-500">비숑이가 열심히 변환하고 있어요...</p>
        </div>
        <div id="pdf-preview-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
    </section>

    <!-- 2. IMAGE TO PDF -->
    <section id="section-img-to-pdf" class="space-y-6 hidden">
        <div class="border-2 border-dashed border-pink-200 hover:border-pink-400 rounded-3xl p-10 text-center bg-white shadow-sm transition-all cursor-pointer relative group">
            <input type="file" id="img-file-input" accept="image/*" multiple class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
            <div class="w-16 h-16 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center mx-auto text-2xl group-hover:scale-110 transition-transform shadow-inner">
                <i class="fa-solid fa-images"></i>
            </div>
            <h3 class="text-lg font-bold mt-4 text-pink-700">PDF로 묶을 이미지들을 선택하세요</h3>
            <p class="text-xs text-pink-400 mt-1">드래그하여 원하는 페이지 순서대로 배치가 가능합니다</p>
        </div>

        <div id="img-controls" class="bg-white p-6 rounded-3xl border border-pink-100 shadow-sm hidden flex flex-wrap justify-between items-center gap-4">
            <span id="img-total-count" class="font-bold text-pink-800">선택된 이미지: 0장</span>
            <div class="flex flex-wrap gap-3">
                <select id="pdf-page-size" class="border border-pink-200 rounded-xl px-3 py-2 text-sm bg-pink-50/50 outline-none">
                    <option value="a4">A4 (표준)</option>
                    <option value="fit">이미지 비율 맞춤</option>
                </select>
                <select id="pdf-orientation" class="border border-pink-200 rounded-xl px-3 py-2 text-sm bg-pink-50/50 outline-none">
                    <option value="portrait">세로형</option>
                    <option value="landscape">가로형</option>
                </select>
                <button onclick="generatePDFFromImages()" class="bg-rose-500 hover:bg-rose-600 text-white rounded-xl px-5 py-2 text-sm font-semibold shadow-sm transition-colors">PDF로 생성하기</button>
                <button onclick="resetImgApp()" class="bg-pink-100 hover:bg-pink-200 text-pink-600 rounded-xl px-4 py-2 text-sm transition-colors">초기화</button>
            </div>
        </div>

        <div id="img-sortable-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4"></div>
    </section>

    <!-- 3. PDF MERGE -->
    <section id="section-pdf-merge" class="space-y-6 hidden">
        <div class="border-2 border-dashed border-pink-200 hover:border-pink-400 rounded-3xl p-10 text-center bg-white shadow-sm transition-all cursor-pointer relative group">
            <input type="file" id="merge-file-input" accept="application/pdf" multiple class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
            <div class="w-16 h-16 bg-purple-100 text-purple-400 rounded-full flex items-center justify-center mx-auto text-2xl group-hover:scale-110 transition-transform shadow-inner">
                <i class="fa-solid fa-object-group"></i>
            </div>
            <h3 class="text-lg font-bold mt-4 text-pink-700">하나로 합칠 PDF 파일들을 선택하세요</h3>
            <p class="text-xs text-pink-400 mt-1">목록을 마우스로 끌어서 결합 순서를 자유롭게 지정하세요</p>
        </div>

        <div id="merge-controls" class="bg-white p-6 rounded-3xl border border-pink-100 shadow-sm hidden flex
